# Plot configs

# Data file
plot_types:
  time_series_2d:
    data_path: ""
    # bool to save plot
    plot_save: True
    # bool to show plot
    plot_show: False
    # plot name, if no name is specified then a default name will be used
    plot_name: "Time Series Plot"
    # location to save simulation plot
    plot_save_path:
    # factor to subsample the data
    subsample: 1
    # start time
    start_time: "2020-02-01"
    # end time
    end_time: "2024-12-01"
    # default plot height
